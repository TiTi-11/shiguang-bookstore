name: 功能建议
description: 想要的新功能或改进点
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 使用场景
      description: 你在什么情况下觉得需要这个功能？
      placeholder: 例如：想给 AI 推荐加个"预算 50 以内"的条件
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做
      description: 描述你期望的交互或实现思路（可选）
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 商城（首页 / 分类 / 详情）
        - 购物车与下单
        - AI 推荐官
        - 订单 / 收藏 / 我的
        - 工程化（构建、测试、文档）
        - 其他
    validations:
      required: true
