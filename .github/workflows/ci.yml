name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: 静态检查与逻辑测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS 语法检查
        run: |
          fail=0
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: 静态检查（页面/组件/图片/跳转）
        run: node tests/static-check.js

      - name: 业务逻辑测试
        run: node tests/logic.test.js
